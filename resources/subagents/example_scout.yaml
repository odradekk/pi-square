# Pi subagent V2 overlay example
#
# Discovery precedence:
# - Package definitions: resources/subagents/*.yaml (read-only at runtime)
# - User overlays: ~/.pi/agent/subagents/*.yaml
# - Project overlays: nearest .pi/subagents/*.yaml walking up from cwd
#
# Higher layers override only fields they declare. Omitted fields inherit. Use null
# for a scalar clear and [] for an array clear. Deleting a higher overlay reveals
# the next lower definition again.

promptVersion: 2
name: example_scout

model: null
effort: low

description: >
  Fast read-only repository reconnaissance for locating files, symbols, configs,
  and concrete evidence before planning or editing. Use it for codebase lookup and
  diagnosis while keeping code changes with an implementation agent.

# Parent system inheritance defaults to true. Set false for a fully isolated profile.
inheritParentSystem: true

# Optional SYSTEM-layer policy. It augments immutable governance and the inherited
# parent core; it never replaces either one.
policy: |
  Operate read-only and keep the workspace unchanged.
  Prefer exact file paths, symbols, and short factual notes over broad commentary.
  State the specific evidence gap when available material is insufficient.

# Replayed before every fresh or resumed delegated task.
instructions: |
  Verify file paths and relevant code before concluding.
  Quote concrete evidence when possible.

# Replayed after every task as its delivery contract.
output: |
  Return three concise sections:
  - findings
  - relevant files
  - remaining uncertainty

# Omitted or [] means the runtime default built-in set. This profile is intentionally
# read-only, so it selects only inspection tools.
tools:
  - read
  - grep
  - find
  - ls

# Extension tools are opt-in.
extensionTools: []

# Omitted or [] means all discovered skills. Use [none] to disable every skill.
skills: []

# A false effective value removes the definition from the parent catalog and tool
# lookup. A user or project overlay can change only this field to hide/reveal it.
visible: false
