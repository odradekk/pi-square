name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24.14.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install experiment sandbox
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap apparmor
          # Ubuntu requires an application profile for unprivileged namespaces.
          # Scope permission to bwrap in this disposable runner; keep global policy.
          sudo tee /etc/apparmor.d/pi-square-bwrap >/dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile pi-square-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser -r /etc/apparmor.d/pi-square-bwrap
          bwrap --unshare-all --ro-bind / / -- /usr/bin/true

      - name: Run tests
        run: npm test

      - name: Type check
        run: npm run typecheck

      - name: Run smoke test
        run: npm run smoke

      - name: Validate publication tarball
        run: npm run package:check
